<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal</title>
  <!-- NOTE: Missing lang attribute on <html> -->
  <!-- NOTE: Title is too short -->
  <!-- NOTE: Missing <meta name="description"> -->
  <!-- NOTE: Missing Open Graph social meta tags (og:title, og:image, og:description) -->
  <!-- NOTE: Missing <link rel="canonical"> -->

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #64748b;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 32px;
      border-bottom: 1px solid var(--border);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 700;
    }
    .container {
      max-width: 480px;
      width: 100%;
      margin: 40px auto;
      padding: 0 16px;
      flex: 1;
    }
    .login-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 24px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #cbd5e1;
    }
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    input[type="tel"], input[type="password"], input[type="text"] {
      width: 100%;
      background: #090d16;
      border: 1px solid var(--border);
      color: #fff;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: var(--primary);
    }
    .btn-eye {
      position: absolute;
      right: 8px;
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
    }
    .btn-eye:hover { color: #fff; }
    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-submit:hover { opacity: 0.95; }
    .footer-links {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
      font-size: 12px;
    }
    .footer-links a {
      color: #818cf8;
      text-decoration: none;
    }
    .footer-links a:hover { text-decoration: underline; }
    .hero-banner {
      margin-top: 30px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .hero-banner img {
      width: 100%;
      height: auto;
      display: block;
    }
    footer {
      text-align: center;
      padding: 24px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="brand">
      <!-- FLAW 1: Image missing alt attribute -->
      <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=60&h=60&fit=crop" width="32" height="32" style="border-radius: 6px;">
      <span>AcademiX AI</span>
    </div>
    <nav>
      <!-- FLAW 2: External link with target="_blank" missing rel="noopener noreferrer" -->
      <a href="https://tashkent.aitinkerers.org" target="_blank" style="color: #94a3b8; text-decoration: none; font-size: 13px;">
        Community Portal
      </a>
    </nav>
  </header>

  <!-- MAIN LOGIN CONTAINER -->
  <main class="container">
    <div class="login-card">
      <h1>Tizimga kirish</h1>
      <p class="subtitle">Telefon raqamingiz va parolingizni kiriting</p>

      <form onsubmit="event.preventDefault(); alert('Kirish bosildi!');">
        <!-- FIELD 1: Phone -->
        <div class="form-group">
          <label for="phone">Telefon raqam</label>
          <!-- FLAW 3: Missing autocomplete="tel" -->
          <input type="tel" id="phone" name="phone" placeholder="+998901234567" required>
        </div>

        <!-- FIELD 2: Password -->
        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
            <label for="password" style="margin-bottom: 0;">Parol</label>
            <a href="#" style="font-size: 11px; color: #818cf8; text-decoration: none;">Parolni unutdingizmi?</a>
          </div>
          <div class="input-wrapper">
            <!-- FLAW 4: Missing autocomplete="current-password" -->
            <input type="password" id="password" name="password" placeholder="••••••••" required>
            <!-- FLAW 5: SVG Icon button without aria-label -->
            <button type="button" class="btn-eye" onclick="togglePass()">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <!-- SUBMIT BUTTON -->
        <button type="submit" class="btn-submit">
          Kirish
        </button>
      </form>
    </div>

    <!-- FLAW 6: Second <h1> heading on page -->
    <h1 style="font-size: 16px; margin-top: 30px; text-align: center; color: #94a3b8;">
      Platforma xavfsizligi va qulaylik kafolatlangan
    </h1>

    <!-- HERO PROMO BANNER -->
    <div class="hero-banner">
      <!-- FLAW 7: Second image without alt attribute -->
      <img src="https://images.unsplash.com/photo-1551288049-bebda4e38f71?w=800&h=400&fit=crop">
    </div>
  </main>

  <footer>
    <p>&copy; 2026 AcademiX AI. Barcha huquqlar himoyalangan.</p>
  </footer>

  <script>
    function togglePass() {
      const p = document.getElementById('password');
      p.type = p.type === 'password' ? 'text' : 'password';
    }
  </script>
</body>
</html>
